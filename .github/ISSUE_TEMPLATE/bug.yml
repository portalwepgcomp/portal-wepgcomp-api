name: Bug
description: Reportar um comportamento incorreto ou falha
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: O que está errado e o impacto.
      placeholder: Ex.: GET /presentation/bookmarks retorna favoritos de todas as edições.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      description: Opcional, mas ajuda.
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: esperado_atual
    attributes:
      label: Esperado vs atual
      description: Opcional.
      placeholder: |
        Esperado: ...
        Atual: ...
  - type: textarea
    id: notas
    attributes:
      label: Notas
      description: Hipótese técnica, arquivos, link do outro repo, etc. (opcional)
