name: Bug
description: Reportar um comportamento incorreto ou falha
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: mini
    attributes:
      label: Mini descrição (obrigatório)
      description: 1–3 frases do problema e impacto.
      placeholder: Ex.: GET /presentation/bookmarks retorna favoritos de todas as edições.
    validations:
      required: true
  - type: dropdown
    id: escopo
    attributes:
      label: Escopo deste repositório
      options:
        - Backend (API / Nest)
        - Frontend (UI) — use só se este for o repo do front
        - Ambos (vincular issue no outro repo)
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      placeholder: local / staging / produção
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: atual
    attributes:
      label: Comportamento atual
    validations:
      required: true
  - type: textarea
    id: evidencias
    attributes:
      label: Evidências
      description: Logs, endpoint, status HTTP, payload (sem senhas/tokens/JWT).
  - type: textarea
    id: relacionados
    attributes:
      label: Issues / PRs relacionados
      description: Links do outro repo (api↔front) quando o bug for cross-cutting.
      placeholder: "Ex.: portal-wepgcomp-frontend#12"
  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      placeholder: |
        - [ ] …
    validations:
      required: true
