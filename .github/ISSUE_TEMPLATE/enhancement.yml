name: Melhoria / Tarefa
description: Nova funcionalidade, ajuste ou tarefa técnica
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: O que deve ser feito e por quê.
      placeholder: Ex.: Endpoint para o usuário autenticado atualizar os próprios dados.
    validations:
      required: true
  - type: textarea
    id: detalhes
    attributes:
      label: Detalhes
      description: Contrato, regras de negócio, campos permitidos (opcional).
  - type: textarea
    id: notas
    attributes:
      label: Notas
      description: Hipótese técnica, arquivos, link do outro repo, etc. (opcional)
