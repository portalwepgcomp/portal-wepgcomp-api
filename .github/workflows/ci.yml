name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  build:
    name: Lint + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Align npm with lockfile
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Validate production Docker build (Alpine)
        # Builda a imagem real de produção (node:22-alpine/musl) para pegar problemas
        # que só aparecem nesse ambiente (ex.: package-lock.json desincronizado que passa
        # no npm ci do runner glibc do CI, mas falha no build do Dokku em Alpine/musl).
        run: docker build -t ci-image-check:${{ github.sha }} .
